.stage-hero .mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.stage-hero .mosaic img.big{grid-column:span 2;grid-row:span 2}
.stage-hero .mosaic .tex{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent) 0 6px,transparent 6px 14px)}
.stage-hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,24,22,.2),rgba(26,24,22,.9))}
html[data-theme="light"] .stage-hero .veil{background:linear-gradient(180deg,rgba(245,240,234,.25),rgba(245,240,234,.92))}
.stage-hero .inner{position:relative;z-index:2;display:flex;gap:34px;align-items:flex-end;width:100%;flex-wrap:wrap}
.stage-hero .han{font-family:var(--han);font-size:9rem;line-height:1;color:var(--c);text-shadow:0 4px 40px color-mix(in srgb,var(--c) 45%,transparent)}
.stage-hero .meta h1{font-size:2.6rem;text-transform:uppercase;letter-spacing:.15em}
.stage-hero .addphoto{position:absolute;right:20px;top:20px;z-index:3}
.substage{border-top:1px solid var(--line);padding:20px 0}
.substage .hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.substage .hd h3{font-size:1.35rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.gallery .photo{aspect-ratio:1;cursor:zoom-in}
.gallery .photo .pctl{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:4px;opacity:0;transition:opacity .2s var(--ease)}
.gallery .photo:hover .pctl,.gallery .photo:focus-within .pctl{opacity:1}
.gallery .photo .pctl button{width:26px;height:26px;border-radius:50%;border:none;background:rgba(26,24,22,.75);color:#e8e0d4;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.gallery .photo .pctl button:hover{background:var(--page-accent);color:#1a1816}
.gallery .photo .pcap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 8px 6px;font-size:.66rem;color:#e8e0d4;background:linear-gradient(transparent,rgba(26,24,22,.8));pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formative{background:var(--surface-2);border-radius:12px;padding:16px 18px;margin-top:10px}
.formative > .row.between{padding-right:34px}
.formative .installed{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.formative .installed .k{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--page-accent);margin-bottom:4px}
.versions .v{padding:12px 0;border-top:1px dashed var(--line);color:var(--muted);font-family:var(--serif);font-size:1.05rem;line-height:1.7}
.retro-values{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px}
.retro-values .rv-row{display:grid;grid-template-columns:1fr 120px 36px;gap:10px;align-items:center;font-size:.85rem}
.shelf{display:flex;gap:26px;flex-wrap:wrap;padding:30px 20px 16px;border-bottom:6px solid var(--surface-3);border-radius:0 0 6px 6px;background:linear-gradient(180deg,transparent 80%,rgba(0,0,0,.15))}
.artifact{width:150px;transform:rotate(var(--rot));transition:transform .4s var(--ease)}
.artifact:hover{transform:rotate(0) scale(1.06);z-index:3}
.artifact .paper{background:#f2e8d8;padding:8px;box-shadow:0 8px 18px rgba(0,0,0,.4);border-radius:2px;color:#2c2520;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--quote);font-style:italic;font-size:.8rem;text-align:center}
.artifact .paper img{max-width:100%;display:block}
.artifact .cap{font-size:.72rem;color:var(--muted);margin-top:8px;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 8px}
.letter{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line-2);border-radius:4px;padding:30px 34px;font-family:var(--serif);font-size:1.12rem;line-height:1.8;position:relative;box-shadow:var(--shadow)}
.letter::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--page-accent));opacity:.6}
.letter .who{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.songs li{padding:6px 0;border-top:1px dashed var(--line);font-family:var(--serif);font-size:1.05rem}
.songs{list-style:none;padding:0;margin:0}

/* ============================================================
   4. VISION TREE
   ============================================================ */
.tree-wrap{position:relative;height:calc(100vh - 150px);min-height:560px;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--sage) 8%,transparent),transparent 60%),var(--surface);border:1px solid var(--line)}
.tree-wrap svg{width:100%;height:100%;display:block}
.tree-wrap .branch{cursor:pointer}
.tree-wrap .branch path.limb{transition:stroke-width .8s var(--ease),stroke .8s var(--ease),opacity .8s;stroke-linecap:round;fill:none}
.tree-wrap .branch:hover path.limb{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--sage) 60%,transparent))}
.tree-wrap .branch .lbl{font-family:var(--serif);font-size:13px;fill:var(--text);letter-spacing:.03em;pointer-events:none}
.tree-wrap .branch .sc{font-family:var(--mono);font-size:9px;fill:var(--muted)}
.tree-wrap .leaf{transform-box:fill-box;transform-origin:0% 50%}
.tree-wrap .trace{pointer-events:none;fill:none;stroke:var(--gold);stroke-width:2;opacity:0;transition:opacity .3s}
.tree-wrap .era-lbl{font-family:var(--serif);font-size:12px;letter-spacing:.2em;fill:var(--faint);text-transform:uppercase}
.tree-legend{position:absolute;left:18px;bottom:16px;display:flex;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--faint);flex-wrap:wrap;max-width:60%}
.tree-tools{position:absolute;right:18px;top:16px;display:flex;gap:8px;z-index:3}
.vision-panel .score{display:flex;align-items:center;gap:14px;margin:10px 0 18px}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.72rem;color:var(--muted);cursor:pointer;transition:all .2s var(--ease)}
.ladder button.on{background:color-mix(in srgb,var(--sage) 25%,transparent);border-color:var(--sage);color:var(--text)}
.next-action{background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:12px;padding:14px 18px;margin:14px 0 22px}
.next-action .k{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}
.next-action .ed{font-family:var(--serif);font-size:1.2rem}
.sensory .q{padding:10px 0;border-top:1px dashed var(--line)}
.sensory .q .k{font-family:var(--quote);font-style:italic;color:var(--muted);font-size:.9rem;margin-bottom:4px}
.vp-sec{margin-top:26px}
.vp-sec > .sc{display:block;margin-bottom:8px}
.evidence-item{padding:8px 0;border-top:1px dashed var(--line);font-size:.9rem;display:flex;gap:10px}
.evidence-item .mono{flex:none;padding-top:3px}
.deps{display:flex;gap:6px;flex-wrap:wrap}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.spec-grid .k{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.feeling{display:flex;gap:6px;align-items:center}
.feeling button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;font-size:.7rem;color:var(--muted)}
.feeling button.on{background:var(--sage);color:#1a1816;border-color:transparent}
.fruit-ceremony{position:fixed;inset:0;pointer-events:none;z-index:150}
.fruit-ceremony i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:burst 1.4s var(--ease) forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ---- the lifeline ---- */
.lifeline-wrap{margin:0 0 18px}
.lifeline{display:flex;gap:16px;overflow-x:auto;padding:8px 4px 16px;scroll-snap-type:x proximity;scroll-behavior:smooth;scrollbar-width:thin;align-items:stretch}
.era-col{flex:0 0 320px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px 16px 12px;position:relative;display:flex;flex-direction:column;gap:10px;transition:border-color .2s var(--ease),transform .2s var(--ease),opacity .2s,box-shadow .3s var(--ease)}
.era-col.dragging{opacity:.4}
.era-col.over{border-color:var(--c);transform:translateX(6px)}
.era-col.past{background:linear-gradient(180deg,color-mix(in srgb,#c9a46a 9%,var(--surface)),var(--surface));color:var(--muted)}
.era-col.past .goal-card,.era-col.past .life-event{filter:saturate(.72) sepia(.12)}
.era-col.past .era-name{color:var(--muted)}
.era-col.present{flex-basis:360px;border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 14px 44px color-mix(in srgb,var(--c) 18%,transparent);animation:eraglow 5s ease-in-out infinite}
@keyframes eraglow{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent),0 14px 44px color-mix(in srgb,var(--c) 14%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 14px 54px color-mix(in srgb,var(--c) 30%,transparent)}}
.era-col.future{opacity:.86;background:linear-gradient(180deg,color-mix(in srgb,#6b7f8e 12%,var(--surface)),var(--surface));filter:brightness(.96)}
.era-col.future .goal-card{border-style:dashed;background:transparent}
.era-head{display:flex;flex-direction:column;gap:6px}
.era-top{display:flex;align-items:center;gap:8px}
.era-handle{cursor:grab;color:var(--faint);font-size:1rem;user-select:none}
.era-swatch{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-3);cursor:pointer;flex:none;padding:0}
.era-name{font-family:var(--serif);font-size:1.25rem;flex:1;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.era-rename{width:100%;font:inherit;background:var(--surface-2);border:1px solid var(--c);border-radius:6px;padding:2px 6px;color:var(--text);outline:none}
.era-del{background:none;border:none;cursor:pointer;opacity:.3;font-size:.85rem;padding:2px;transition:opacity .2s}
.era-del:hover{opacity:1}
.era-badge{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--faint);white-space:nowrap}
.era-badge.closed{border-style:dashed;transform:rotate(-4deg);color:#b8955a;border-color:#b8955a80}
.era-badge.live{color:#e3a15a;border-color:#e3a15a;display:inline-flex;align-items:center;gap:6px}
.era-badge.live i{width:6px;height:6px;border-radius:50%;background:#e3a15a;animation:pulse 1.6s ease-in-out infinite}
.era-badge.ahead{color:var(--ment);border-color:color-mix(in srgb,var(--ment) 60%,transparent)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.45}}
.era-sub{font-size:.8rem;color:var(--muted)}
.era-years{font-size:.7rem}
.done-badge{color:var(--sage)}
.era-stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.era-stage .han-sm{font-family:var(--han);font-size:.9rem}
.stage-link{width:auto;padding:2px 6px;font-size:.66rem;color:var(--faint);background:transparent;border-color:transparent}
.stage-link:hover{border-color:var(--line-2)}
.era-goals{display:flex;flex-direction:column;gap:8px}
.goal-card{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.goal-card:hover{border-color:var(--c);transform:translateY(-1px)}
.goal-check{display:flex;padding-top:2px}
.goal-check input{accent-color:var(--c);cursor:pointer;width:15px;height:15px}
.goal-body{flex:1;min-width:0}
.goal-title{font-family:var(--serif);font-size:1.02rem;line-height:1.3}
.goal-card.done .goal-title{text-decoration:line-through;color:var(--muted)}
.goal-badge{color:var(--sage);font-size:.85rem}
.goal-meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:.72rem}
.goal-refl{font-family:var(--quote);font-style:italic;font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.5}
.goal-ring{flex:none;display:flex}
.goal-phase{cursor:pointer}
.era-divider{font-family:var(--serif);text-transform:uppercase;letter-spacing:.14em;font-size:.66rem;color:var(--faint);padding:6px 0 6px;border-top:1px dashed var(--line-2);margin-top:4px;display:flex;justify-content:space-between}
.era-events{display:flex;flex-direction:column;gap:6px}
.era-lived{display:flex;flex-direction:column;gap:8px}
.life-event{position:relative;border-left:3px solid var(--c);padding:6px 24px 6px 12px;background:transparent;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:2px}
.life-event em{font-family:var(--quote);font-size:.9rem;line-height:1.5;color:var(--text)}
.life-event .mono{font-size:.62rem}
.life-event .del-x{top:6px;right:4px;width:20px;height:20px;font-size:.8rem}
.era-foot{display:flex;gap:8px;justify-content:space-between;margin-top:auto;padding-top:8px}
.era-add{flex:0 0 160px;scroll-snap-align:end;border:1px dashed var(--line-2);border-radius:14px;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:.9rem;transition:all .2s var(--ease);min-height:160px}
.era-add:hover{border-color:var(--page-accent);color:var(--text)}
.era-palette{position:absolute;left:12px;top:44px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow)}
.era-palette button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.era-palette button.on,.era-palette button:hover{border-color:var(--text)}
.now-marker{flex:0 0 46px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-snap-align:center}
.now-line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(180deg,transparent,#e3a15a 20%,#ff9f6e 50%,#e3a15a 80%,transparent);background-size:100% 200%;animation:shimmer 3s linear infinite;opacity:.9}
@keyframes shimmer{from{background-position:0 0}to{background-position:0 200%}}
.now-dot{width:14px;height:14px;border-radius:50%;background:#e3a15a;box-shadow:0 0 0 6px color-mix(in srgb,#e3a15a 25%,transparent);animation:pulse 2s ease-in-out infinite;z-index:1}
.now-label{position:absolute;top:8px;left:50%;transform:translateX(-50%) rotate(-90deg) translateX(-50%);transform-origin:left top;white-space:nowrap;font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:#e3a15a;text-transform:uppercase;top:50%;left:calc(50% + 14px);transform:translate(-50%,-50%) rotate(90deg)}
.wiz-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.era-col.present,.now-line,.now-dot,.era-badge.live i{animation:none}}

/* ============================================================
   5. VALUES
   ============================================================ */
.values-list{list-style:none;padding:0;margin:0}
.values-list li{display:grid;grid-template-columns:34px 1fr 140px 60px 30px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:grab;transition:background .2s}
.values-list li:hover{background:var(--surface-2)}
.values-list li.dragging{opacity:.4}
.values-list li.over{border-top:2px solid var(--page-accent)}
.values-list .rank{font-family:var(--serif);font-size:1.3rem;color:var(--faint)}
.values-list .nm{font-family:var(--serif);font-size:1.2rem}
.values-list .nm a{color:inherit;text-decoration:none}
.values-list .nm a:hover{color:var(--page-accent)}
.values-list .pct{font-family:var(--mono);font-size:.8rem;text-align:right}
.weather{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;align-items:center}
.weather .strip{display:flex;height:16px;gap:1px}
.weather .strip i{flex:1;background:var(--c);opacity:var(--o);transition:opacity .5s;border-radius:2px}
.weather .lbl{font-size:.72rem;color:var(--muted);text-align:right}
.gap-list .g{display:grid;grid-template-columns:1fr 3fr 60px;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:.85rem}
.matrix{border-collapse:collapse;width:100%;font-size:.75rem}
.matrix th{font-family:var(--serif);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line-2);vertical-align:bottom}
.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;padding:6px 4px;font-size:.72rem;height:130px}
.matrix td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.matrix td i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sage)}
.matrix td.blind{background:color-mix(in srgb,var(--rose) 15%,transparent)}
.matrix tr.blindrow td:first-child{color:var(--rose)}
.value-field{margin-top:24px}
.value-field .q{font-family:var(--serif);font-size:1.25rem;margin-bottom:8px}
.value-field .hist{margin-top:8px}
.snapshot-form .r{display:grid;grid-template-columns:1fr 1fr 44px;gap:12px;align-items:center;padding:6px 0}
.snapshot-form .r .n{font-family:var(--serif)}
.sv-block{border-top:1px dashed var(--line);padding-left:10px;margin-left:-10px;border-left:2px solid transparent;transition:border-color .2s var(--ease),background .2s var(--ease)}
.sv-block.changed{border-left-color:var(--c);background:color-mix(in srgb,var(--c) 6%,transparent)}
.sv-note{height:0;overflow:hidden;transition:height .2s var(--ease)}
.sv-note .ta{margin:2px 0 10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--page-accent)) 16%,transparent);border-color:var(--c,var(--page-accent));opacity:0;transform:translateY(-4px);transition:opacity .2s var(--ease) .04s,transform .2s var(--ease) .04s}
.sv-note.open .ta{opacity:1;transform:none}
.delta{font-family:var(--mono);font-size:.6rem;white-space:nowrap}
.delta.up{color:var(--sage)}.delta.down{color:var(--rose)}.delta.same,.delta.none{color:var(--faint)}
.snap-list{max-height:520px;overflow-y:auto;margin-top:14px;padding-right:4px;scrollbar-width:thin}
.snap-row{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;transition:border-color .2s var(--ease)}
.snap-row:hover{border-color:var(--line-2)}
.snap-head{display:grid;grid-template-columns:150px 1fr 60px;gap:14px;align-items:center;padding:12px 16px;cursor:pointer}
.snap-date{display:flex;flex-direction:column;gap:2px}
.snap-bars{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.snap-bar{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.snap-bar i{display:block;width:12px;border-radius:3px 3px 1px 1px;background:var(--surface-3)}
.snap-bar i.low{background:var(--rose)}.snap-bar i.mid{background:var(--gold)}.snap-bar i.high{background:var(--sage)}
.snap-chev{transition:transform .25s var(--ease);font-size:1.1rem;text-align:center}
.snap-row.open .snap-chev{transform:rotate(90deg)}
.snap-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.snap-detail-inner{overflow:hidden;min-height:0}
.snap-row.open .snap-detail{grid-template-rows:1fr}
.snap-row.open .snap-detail-inner{padding:0 16px 14px;border-top:1px dashed var(--line);padding-top:10px}
.snap-val{display:grid;grid-template-columns:150px 1fr 34px 58px;gap:10px;align-items:center;padding:5px 0;font-size:.85rem}
.snap-val .snap-note{grid-column:1 / -1;font-family:var(--quote);font-style:italic;color:var(--muted);padding:2px 0 6px 12px;border-left:2px solid var(--line-2)}
.trend-line,.trend-dot{transition:opacity .2s var(--ease)}
@media (max-width:900px){.snap-head{grid-template-columns:1fr 20px}.snap-bars{grid-column:1 / -1}.snap-val{grid-template-columns:1fr 34px 58px}.snap-val>span:first-child{grid-column:1 / -1}}
.time-slider{margin-top:16px}
.time-slider .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.65rem;color:var(--faint);margin-top:4px}
.spark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.spark-grid .s{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.spark-grid .s .n{font-size:.68rem;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   6. JOURNALS
   ============================================================ */
.journal-layout{display:grid;grid-template-columns:200px 1fr;gap:34px}
.jnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:40px;align-self:start}
.jnav button{background:none;border:none;text-align:left;padding:9px 12px;color:var(--muted);cursor:pointer;border-radius:8px;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;transition:all .2s var(--ease)}
.jnav button:hover{color:var(--text);background:var(--surface-2)}
.jnav button.active{color:var(--text);background:var(--surface);border-left:2px solid var(--page-accent)}
.jnav button .n{font-family:var(--mono);font-size:.62rem;color:var(--faint)}
.jtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.jtools .inp{max-width:260px}
.otd{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 8%,transparent),transparent);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:22px}
.answer-log{margin-top:10px;padding-left:12px;border-left:2px solid var(--line-2)}
.answer-log .a{padding:6px 0;font-size:.9rem}
.status-pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.66rem;font-family:var(--mono);background:var(--surface-3);color:var(--muted)}
@media (max-width:900px){.journal-layout{grid-template-columns:1fr}.jnav{flex-direction:row;overflow-x:auto;position:static}}

/* ============================================================
   7. SKILLS
   ============================================================ */
/* ---- skill tree (hierarchical, zoomable) ---- */
.skill-wrap{position:relative;height:640px;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--page-accent) 6%,transparent),transparent 60%),var(--surface);border:1px solid var(--line);touch-action:none}
.skill-wrap svg.sk-svg{width:100%;height:100%;display:block;cursor:grab}
.skill-wrap svg.sk-svg.panning{cursor:grabbing}
.sk-hint{position:absolute;left:14px;bottom:10px;font-size:.6rem;color:var(--faint);pointer-events:none}
.sk-link{fill:none;stroke:var(--line-2);stroke-width:1.4;transition:stroke .2s var(--ease),stroke-width .2s var(--ease),opacity .3s}
.sk-link.hot{stroke:var(--page-accent);stroke-width:2.2;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--page-accent) 55%,transparent))}
.sk-node{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .1s ease-out,opacity .3s var(--ease)}
.sk-node:hover{transform:scale(1.05)}
.sk-node:hover .sk-body{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--nc) 55%,transparent));stroke:var(--nc)}
.sk-body{fill:var(--surface-2);stroke:color-mix(in srgb,var(--nc) 45%,var(--line-2));stroke-width:1.2;transition:filter .2s var(--ease),stroke .2s var(--ease)}
.sk-node.root .sk-body{fill:color-mix(in srgb,var(--page-accent) 14%,var(--surface-2));stroke:var(--page-accent)}
.sk-node.cat .sk-body{fill:color-mix(in srgb,var(--nc) 12%,var(--surface-2))}
.sk-bar{fill:var(--nc)}
.sk-title{fill:var(--text);font-family:var(--serif);letter-spacing:.02em;pointer-events:none}
.sk-sub{fill:var(--muted);font-family:var(--mono);font-size:8.5px;pointer-events:none}
.sk-toggle circle{fill:var(--surface);stroke:var(--line-2);stroke-width:1;cursor:pointer;transition:stroke .2s}
.sk-toggle:hover circle{stroke:var(--nc)}
.sk-toggle text{fill:var(--muted);font-family:var(--mono);font-size:11px;pointer-events:none}
.sk-node.locked{opacity:.5;cursor:not-allowed}
.sk-node.locked:hover{transform:none}
.sk-node.locked .sk-body{filter:none}
.sk-node.glow .sk-body{animation:nodeGlow 2s ease-in-out infinite}
.sk-node.selected .sk-body{stroke:var(--nc);stroke-width:2}
@keyframes nodeGlow{0%,100%{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--nc) 45%,transparent)) drop-shadow(0 0 6px color-mix(in srgb,var(--nc) 25%,transparent))}50%{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--nc) 70%,transparent)) drop-shadow(0 0 12px color-mix(in srgb,var(--nc) 45%,transparent))}}
.sk-node.reveal{animation:skReveal .32s var(--ease) both;transform-origin:center var(--oy,center)}
@keyframes skReveal{from{opacity:0;transform:scaleY(0) translateY(-6px)}to{opacity:1;transform:none}}
.sk-link.reveal{animation:skFade .35s var(--ease) both}
@keyframes skFade{from{opacity:0}to{opacity:1}}
.sk-node.dragging{opacity:.35}
.sk-node.droptarget .sk-body{stroke:var(--gold);stroke-width:2.5;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--gold) 60%,transparent))}
.sk-ghost{position:absolute;z-index:6;pointer-events:none;background:var(--surface-2);border:1px solid var(--page-accent);border-radius:8px;padding:4px 10px;font-size:.8rem;box-shadow:var(--shadow)}
.minimap{position:absolute;right:12px;bottom:12px;width:150px;height:100px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;cursor:pointer;z-index:4;backdrop-filter:blur(4px)}
.minimap svg{width:100%;height:100%;display:block}
.minimap .mm-view{fill:color-mix(in srgb,var(--page-accent) 14%,transparent);stroke:var(--page-accent);stroke-width:1}
@media (prefers-reduced-motion:reduce){.sk-node.glow .sk-body,.sk-node.reveal,.sk-link.reveal{animation:none}}
/* the living tree */
.sk-organic{width:100%;height:100%;display:block}
.sk-organic .sk-twig{cursor:pointer}
.sk-organic .sk-twig .limb,.sk-organic .sk-branch .limb-tint{transition:stroke-width .25s var(--ease),opacity .3s var(--ease)}
.sk-organic.hov .sk-twig:not(.hot){opacity:.42}
.sk-organic.hov .sk-branch:not(.hot) .limb-tint{opacity:.1}
.sk-organic .sk-twig.hot .limb{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--nc) 60%,transparent))}
.sk-organic .sk-twig.hot .sk-lbl{fill:var(--text);font-weight:600}
.sk-organic .sk-lbl{fill:var(--text);font-family:var(--serif);letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.sk-organic .sk-sublbl{fill:var(--muted);font-family:var(--mono);font-size:8.5px;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.sk-organic .sk-catlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.sk-organic .sk-catsub{fill:var(--faint);font-family:var(--mono);font-size:8px;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.sk-organic .sk-twig.locked{cursor:not-allowed}
.sk-organic .sk-leader{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 2}
.sk-organic .sk-canopy{transition:opacity .3s var(--ease)}
.sk-organic.hov .sk-canopy{opacity:.04}
.sk-organic .leaf{transform-box:fill-box;transform-origin:0 50%}
.sk-organic .halo{animation:haloPulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes haloPulse{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.26;transform:scale(1.25)}}
.sk-organic .fruit{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.sk-organic .blossom{animation:blossomPulse 3.2s ease-in-out infinite}
@keyframes blossomPulse{0%,100%{opacity:.75}50%{opacity:1}}
.sk-organic .fall{animation:leafFall 7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes leafFall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.8}100%{opacity:0;transform:translate(14px,70px) rotate(220deg)}}
.sk-organic .sk-sun{animation:sunBreathe 9s ease-in-out infinite alternate}
@keyframes sunBreathe{from{opacity:.7}to{opacity:1}}
html[data-theme="light"] .sk-organic .sk-sun{opacity:.5}
@media (prefers-reduced-motion:reduce){.sk-organic .halo,.sk-organic .blossom,.sk-organic .fall,.sk-organic .sk-sun{animation:none}}
.lvl-track{display:flex;flex-direction:column;position:relative;padding-left:4px}
.lvl-track::before{content:"";position:absolute;left:33px;top:14px;bottom:44px;width:2px;background:var(--line-2)}
.lvl{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 0;position:relative;transition:opacity .2s}
.lvl.dragging{opacity:.35}
.lvl.over .lvl-body{outline:1px dashed var(--c);border-radius:10px}
.lvl-rail{display:flex;align-items:flex-start;gap:4px;position:relative;padding-top:6px}
.lvl-handle{cursor:grab;color:var(--faint);font-size:.9rem;opacity:0;transition:opacity .2s}
.lvl:hover .lvl-handle{opacity:1}
.lvl-node{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface-2);color:var(--muted);font-family:var(--serif);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease);position:relative;z-index:1;padding:0}
.lvl.done .lvl-node{background:var(--c);border-color:var(--c);color:#1a1816}
.lvl.current .lvl-node{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 25%,var(--surface));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);animation:lvlGlow 2s ease-in-out infinite}
@keyframes lvlGlow{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 38%,transparent),0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}}
.lvl.future .lvl-node{opacity:.55}
.lvl.future .lvl-body{opacity:.72}
.lvl-body{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.lvl.current .lvl-body{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.lvl-head{display:flex;align-items:center;gap:10px;cursor:pointer}
.lvl-label{font-family:var(--serif);font-size:1.02rem;flex:1}
.lvl-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ms-chip{font-family:var(--mono);font-size:.62rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.ms-chip.due{color:#d08080;border-color:#b05050}
.lvl-chev{color:var(--faint);transition:transform .25s var(--ease)}
.lvl.open .lvl-chev{transform:rotate(90deg)}
.lvl-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.lvl-detail-inner{overflow:hidden;min-height:0}
.lvl.open .lvl-detail{grid-template-rows:1fr}
.lvl.open .lvl-detail-inner{padding-top:10px}
.lvl-detail .k{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:3px}
.lvl-criteria{list-style:none;padding:0;margin:0}
.lvl-criteria li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:.88rem;position:relative}
.lvl-criteria li .ed{flex:1}
.lvl-res{display:flex;flex-direction:column;gap:4px}
.res-row{display:flex;gap:8px;align-items:center;font-size:.85rem;flex-wrap:wrap;position:relative}
.res-type{font-size:.85rem;min-width:18px;text-align:center}
.res-link{display:inline-flex;align-items:center;gap:6px;color:var(--page-accent);text-decoration:none}
.res-link:hover{text-decoration:underline}
.res-fav{width:14px;height:14px;border-radius:3px}
.res-edit{display:none;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.res-row:hover .res-edit,.res-row:focus-within .res-edit{display:flex}
.res-edit .ed-wrap{min-width:120px;font-size:.72rem}
.ms-axis{position:relative;height:74px;margin:14px 4px 6px}
.ms-line{position:absolute;left:0;right:0;top:18px;height:2px;background:var(--line-2)}
.ms-now{position:absolute;top:8px;transform:translateX(-50%);text-align:center;font-family:var(--mono);font-size:.58rem;color:var(--gold)}
.ms-now i{display:block;width:2px;height:22px;background:var(--gold);margin:0 auto 2px}
.ms-mark{position:absolute;top:12px;transform:translateX(-50%);text-align:center;font-size:.68rem;line-height:1.25}
.ms-mark i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;border:2px solid var(--c);background:var(--surface)}
.ms-mark.reached i{background:var(--c)}
.ms-mark.due i{border-color:#d08080;background:#8e3b3b}
.ms-mark.due .ms-lbl{color:#d08080}
.ms-mark.ahead .ms-lbl{color:var(--text)}
.ms-lbl .mono{font-size:.58rem}
.ms-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ms-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;padding:6px 0;border-top:1px dashed var(--line)}
.ms-note{flex:1;min-width:120px;font-family:var(--quote);font-style:italic;color:var(--muted);font-size:.85rem}
.status-pill.due{color:#d08080;border:1px solid #b05050;background:transparent}
.status-pill.ahead{color:var(--sage)}
.archetype{font-family:var(--quote);font-style:italic;color:var(--muted);font-size:.9rem;padding:10px 14px;border-left:2px solid var(--line-2);margin-top:12px}

/* ============================================================
   8. PROJECTS
   ============================================================ */
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .hd h3{font-size:1.3rem}
.pri{font-family:var(--mono);font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;color:#1a1816}
.pri.P1{background:#c25b5b}.pri.P2{background:#d4a44c}.pri.P3{background:#7f916a}.pri.P4{background:#8a8d8f}
.view-toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.view-toggle button{background:none;border:none;color:var(--muted);padding:6px 12px;cursor:pointer;font-size:.8rem;font-family:var(--sans)}
.view-toggle button.on{background:var(--surface-3);color:var(--text)}
.ptask{display:flex;flex-direction:column;gap:5px;font-size:.72rem}
.mono.due,.due{color:#d08080}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;min-height:220px;display:flex;flex-direction:column;transition:border-color .2s var(--ease),background .2s}
.kcol.over{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.kcol-h{display:flex;justify-content:space-between;padding:10px 12px;font-family:var(--serif);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.kcol-body{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;flex:1}
.kcard{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.kcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.kcard.dragging,.pcard.dragging{opacity:.4}
.gantt{display:flex;overflow-x:auto;padding-bottom:6px;position:relative}
.gantt svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.gantt .g-names{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--line)}
.gantt .g-name{position:absolute;left:0;right:8px;height:16px;line-height:16px;display:flex;justify-content:flex-end;gap:6px;cursor:pointer;color:var(--text);font-family:var(--serif);font-size:.8rem;white-space:nowrap;overflow:hidden}
.gantt .g-name>span:first-child{overflow:hidden;text-overflow:ellipsis}
.gantt .g-name:hover{color:var(--page-accent)}
.gantt .g-bar{cursor:pointer}
.gantt .g-bar:hover rect:first-child{opacity:1;filter:drop-shadow(0 0 4px rgba(0,0,0,.4))}
.gantt .g-proj{cursor:pointer}
.phases{display:flex;flex-direction:column;gap:8px}
.phase{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.phase-h{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;flex-wrap:wrap}
.phase-chev{color:var(--faint);transition:transform .25s var(--ease)}
.phase.open .phase-chev{transform:rotate(90deg)}
.phase-name{font-family:var(--serif);font-size:1rem;flex:1}
.phase-dates{font-size:.62rem}
.phase-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.phase-inner{overflow:hidden;min-height:0}
.phase.open .phase-body{grid-template-rows:1fr}
.phase.open .phase-inner{padding:4px 10px 10px}
.quick-task{margin-bottom:8px;font-size:.85rem;padding:6px 10px}
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dashed var(--line);font-size:.88rem;position:relative}
.task label{display:flex}
.task input[type=checkbox]{accent-color:var(--page-accent);width:15px;height:15px;cursor:pointer}
.task-text{flex:1}
.task.done .task-text{text-decoration:line-through;color:var(--muted)}
.task-due{width:auto;padding:1px 6px;font-size:.66rem;color:var(--faint);background:transparent;border-color:transparent}
.task-due:hover,.task-due:focus{border-color:var(--line-2)}
.task-due.over{color:#d08080}
@media (max-width:900px){.kanban{grid-template-columns:repeat(5,240px)}}
.pstatus{font-size:.68rem;font-family:var(--mono);padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;width:100%;max-width:180px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface-3)}
.heat i.l1{background:color-mix(in srgb,var(--sage) 35%,var(--surface-3))}
.heat i.l2{background:color-mix(in srgb,var(--sage) 65%,var(--surface-3))}
.heat i.l3{background:var(--sage)}
.nod-fab{position:fixed;right:28px;bottom:94px;z-index:45;border-radius:999px;box-shadow:var(--shadow)}
.scatter{position:relative}
.scatter .q{font-family:var(--quote);font-style:italic;font-size:10px;fill:var(--faint)}
.income-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.income-strip .k{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.ideas li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--line);gap:12px}
.ideas{list-style:none;padding:0;margin:0}
.nodlist .nod{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-size:.88rem;align-items:baseline}
.energy-pick{display:flex;gap:6px}
.energy-pick button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:.68rem;color:var(--muted);transition:all .2s var(--ease)}
.energy-pick button.on{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 22%,transparent);color:var(--text)}
.dur-pick{display:flex;gap:6px;flex-wrap:wrap}
.dur-pick button{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:.72rem;color:var(--muted)}
.dur-pick button.on{border-color:var(--page-accent);color:var(--text)}

/* ============================================================
   9. RITUALS & HABITS
   ============================================================ */
.rings-today{display:flex;gap:22px;flex-wrap:wrap;padding:10px 0}
.ring-h{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;text-align:center;cursor:pointer;position:relative}
.ring-h svg{width:64px;height:64px;transition:transform .3s var(--ease)}
.ring-h:hover svg{transform:scale(1.06)}
.ring-h .n{font-size:.72rem;color:var(--muted);line-height:1.25}
.ring-h .s{font-family:var(--mono);font-size:.6rem;color:var(--faint)}
.ring-h.bloom svg{animation:bloom .7s var(--ease)}
@keyframes bloom{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.ring-h .chainline{position:absolute;left:-22px;top:32px;width:22px;height:1px;border-top:1px dashed var(--line-2)}
.dim-head{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;border-top:1px solid var(--line)}
.dim-head .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.dim-head h3{color:var(--c);font-size:1rem;text-transform:uppercase;letter-spacing:.14em}
.habit{display:grid;grid-template-columns:52px 1fr 190px 120px 40px;gap:14px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.habit .nm{font-family:var(--serif);font-size:1.05rem}
.habit .sub{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-top:2px}
.habit .trend{display:flex;gap:6px;font-family:var(--mono);font-size:.62rem;color:var(--muted);align-items:center}
.habit .trend i{display:inline-block;width:28px;height:4px;background:var(--surface-3);border-radius:2px;position:relative;overflow:hidden}
.habit .trend i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c)}
.habit.dragging{opacity:.4}
.cal90{display:grid;grid-template-columns:repeat(13,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;max-width:220px}
.cal90 i{aspect-ratio:1;border-radius:2px;background:var(--surface-3)}
.cal90 i.full{background:var(--sage)}
.cal90 i.min{background:var(--gold)}
.cal90 i.future{opacity:.3}
.balance{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:150px}
.balance div{padding:8px;border-radius:8px;background:color-mix(in srgb,var(--c) 12%,transparent);text-align:center;font-size:.65rem;color:var(--c);font-family:var(--mono)}
.balance div b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--text)}
.flow{counter-reset:step}
.flow .step{display:grid;grid-template-columns:36px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.flow .step::before{counter-increment:step;content:counter(step);font-family:var(--serif);font-size:1.4rem;color:var(--faint)}
.flow .step .t{font-family:var(--serif);font-size:1.1rem;margin-bottom:6px}
.flow .step .d{color:var(--muted);font-size:.88rem;line-height:1.6}
.flow .step .act{margin-top:10px}
.since{font-family:var(--serif);font-size:1.6rem;color:var(--gold)}

/* ============================================================
   10. SYSTEM MAP
   ============================================================ */
/* ============================================================
   HOME — life at a glance
   ============================================================ */
.home-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
@media (max-width:900px){.home-hero{grid-template-columns:1fr}}
.focus-card{background:linear-gradient(135deg,color-mix(in srgb,var(--page-accent) 10%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.focus-card .intent{font-family:var(--serif);font-size:1.5rem;line-height:1.35;margin:6px 0 14px}
.focus-card .intent .ed{display:block}
.focus-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.mini-rings{display:flex;gap:6px;align-items:center}

.next-actions{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.next-actions div{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-size:.9rem}
.next-actions .mono{flex:none}
.house-wrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:420px}

.hnode{cursor:pointer}
.hnode circle.body{transition:r .35s var(--ease),stroke-width .3s var(--ease)}

.hnode .hs{font-family:var(--mono);font-size:8.5px;fill:var(--muted)}
.hnode.daily circle.body{animation:pulseb 3.5s ease-in-out infinite}
@keyframes pulseb{0%,100%{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--page-accent) 35%,transparent))}50%{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--page-accent) 60%,transparent))}}
.hedge{fill:none;stroke:var(--line-2);stroke-width:1.2;transition:all .3s var(--ease)}
.house-wrap.hov .hedge:not(.hot){opacity:.15}
.house-wrap.hov .hnode:not(.hot){opacity:.35}
.hedge.hot{stroke:var(--page-accent);stroke-width:2;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--page-accent) 60%,transparent))}
.htip{position:absolute;background:var(--surface-2);border:1px solid var(--line-2);padding:10px 14px;border-radius:10px;font-size:.78rem;max-width:280px;pointer-events:none;display:none;box-shadow:var(--shadow);z-index:5;line-height:1.5}

@media (max-width:1100px){.bento{grid-template-columns:repeat(2,1fr)}.bento .span2,.bento .span3,.bento .span4,.bento .span6{grid-column:span 2}}

/* ============================================================
   13. SETTINGS
   ============================================================ */

/* view transitions */
::view-transition-old(root),::view-transition-new(root){animation-duration:calc(.32s * var(--page-motion-speed));animation-timing-function:var(--page-ease)}
::view-transition-old(stage-char),::view-transition-new(stage-char){animation-duration:.6s;animation-timing-function:cubic-bezier(.4,0,.2,1);mix-blend-mode:normal}

</style>

<body>
<div class="ambient"><div class="page-scene" id="scA"></div><div class="page-scene" id="scB"></div><div class="page-grad" id="pgA"></div><div class="page-grad" id="pgB"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas class="dust" id="dust"></canvas>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"></main>
</div>
<button class="back-btn" id="backBtn" data-back hidden aria-label="Go back"><span class="arrow">←</span> Back</button>
<div class="topbar">
  <button class="iconbtn" id="btnSearch" title="Search (⌘K)">⌕ <span>search</span> <kbd>⌘K</kbd></button>
  <button class="iconbtn" id="btnSound" title="Interaction sounds">🔕</button>
  <button class="iconbtn" id="btnAmbient" title="Ambient background">🌊</button>
  <button class="iconbtn" id="btnTheme" title="Toggle theme">☾</button>
</div>
<div class="fab-wrap" id="fabWrap"><div class="speed-dial" id="speedDial" hidden></div><button class="fab" id="fab" title="Add anything (press N)" aria-expanded="false">+<span class="hint">add anything · N</span></button></div>
<div class="toast-wrap" id="toasts"></div>
<div id="modals"></div>
<script>
/* ============================================================
   CORE — utilities, state, persistence, editing, router
   ============================================================ */
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x,y)=>x+y,0);
const avg = a => a.length ? sum(a)/a.length : 0;
const byId = (arr,id) => (arr||[]).find(x => x.id === id);
const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const isoDay = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const parseDay = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => isoDay(new Date(parseDay(s).getTime() + n*DAY));
const daysBetween = (a,b) => Math.round((parseDay(b) - parseDay(a))/DAY);
const daysSince = s => s ? daysBetween(s.slice(0,10), today()) : Infinity;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDate(s, style='long'){
  if(!s) return '';
  if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return s; // approximate text dates
  const d = parseDay(s.slice(0,10));
  if(style==='long') return `${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  if(style==='med') return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
  if(style==='short') return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
  return s;
}
function relDays(n){ if(n===Infinity) return 'never'; if(n===0) return 'today'; if(n===1) return 'yesterday'; if(n<30) return `${n} days ago`; if(n<365) return `${Math.round(n/30)} months ago`; return `${(n/365).toFixed(1)} years ago`; }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function hexA(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function occurredSort(e){ if(e.occurredSort) return e.occurredSort; const s = e.occurredAt||''; if(/^\d{4}-\d{2}-\d{2}/.test(s)) return parseDay(s.slice(0,10)).getTime(); const y = (s.match(/\d{4}/)||[])[0]; if(y) return new Date(+y,5,1).getTime(); return new Date(e.createdAt||0).getTime(); }

/* ---------- markdown (small, safe) ---------- */
function md(src){
  if(!src) return '';
  let s = esc(src);
  s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/^&gt; ?(.*)$/gm,'<blockquote>$1</blockquote>').replace(/<\/blockquote>\n<blockquote>/g,'<br>');
  s = s.replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\n<li>)/g,'<ul>$1</ul>').replace(/<\/li>\n<li>/g,'</li><li>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/_([^_\n]+)_/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(TAG_RE, (m, pre, t) => `${pre}<a class="tag" href="#/tag/${encodeURIComponent(t.toLowerCase())}">#${t}</a>`);
  s = s.split(/\n{2,}/).map(p => /^<(h\d|ul|blockquote)/.test(p.trim()) ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  return s;
}

/* ---------- hashtags: any substantive entry can carry them ---------- */
const TAG_RE = /(^|[\s(])#([\p{L}\p{N}][\p{L}\p{N}_-]{1,31})/gu;
const TAGGABLE = ['reflection','memory','lifeevent','media','writing','synchronicity','manifestation','gratitude','dream','question','quote','letter','artifact','progress'];
function parseTags(text){ const out = []; if(!text) return out; for(const m of String(text).matchAll(TAG_RE)) out.push(m[2].toLowerCase()); return out; }
function normTags(list){ return [...new Set((list||[]).map(t => String(t).replace(/^#/,'').trim().toLowerCase()).filter(Boolean))]; }
function entryTags(e){ return normTags([...(e.tags||[]), ...parseTags(e.title), ...parseTags(e.body)]); }
function allTags(){ const c = {}; S.entries.forEach(e => entryTags(e).forEach(t => c[t] = (c[t]||0)+1)); return Object.entries(c).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0])); }
function entriesWithTag(t){ const k = String(t).toLowerCase(); return S.entries.filter(e => entryTags(e).includes(k)); }
function tagChips(e, {link=true}={}){ const t = entryTags(e); return t.length ? `<span class="tagrow">${t.map(x => link ? `<a class="tag" href="#/tag/${encodeURIComponent(x)}">#${x}</a>` : `<span class="tag">#${x}</span>`).join('')}</span>` : ''; }

/* ---------- state ---------- */
const KEY = 'lifeinstrument.v1';
let S = null;
/* persistence lives in db.js (Dexie schema + load/save/backup) */
function migrate(){ if(S.settings && S.settings.home === 'map') S.settings.home = 'home'; wipeDemoData(); if(S.rehearsal && !S.rehearsal){ S.rehearsal = S.rehearsal; } delete S.rehearsal; if(typeof migrateEras === 'function') migrateEras(); const d = seed(); for(const k of Object.keys(d)) if(S[k]===undefined) S[k] = d[k]; if(typeof migrateLifeline === 'function') migrateLifeline(); if(typeof migrateSkillLevels === 'function') migrateSkillLevels(); if(typeof migrateProjects === 'function') migrateProjects(); if(typeof migrateStages === 'function') migrateStages(); if(typeof migrateTasks === 'function') migrateTasks(); if(typeof migrateIdeas === 'function') migrateIdeas(); if(typeof migrateMedia === 'function') migrateMedia(); if(typeof migrateSkillFocus === 'function') migrateSkillFocus(); }

/* One-time: the house used to open furnished with a demonstration life. If that
   demonstration is still here, clear it so the rooms start empty. */
function wipeDemoData(){
  if(S.settings?.demoWiped) return;
  const demo = (S.stages||[]).some(s => s.id === 's1') || (S.skills||[]).some(s => s.id === 'sk-jp-conv') || (S.projects||[]).some(p => p.id === 'p-bar');
  const keep = S.settings || {};
  const fresh = seed();
  for(const k of Object.keys(fresh)) if(demo || S[k] === undefined) S[k] = fresh[k];
  if(demo) S.settings = Object.assign(fresh.settings, {theme:keep.theme||'dark', sound:keep.sound, feltTime:keep.feltTime, home:keep.home||'home', nav:keep.nav, projectView:keep.projectView, firstOpen:keep.firstOpen||today()});
  S.settings.demoWiped = true;
}

/* path access: "stages.#id.narrative" or "rehearsal.script" */
function resolve(path){ const segs = path.split('.'); let o = S; for(let i=0;i<segs.length-1;i++){ o = step(o, segs[i]); if(o==null) return [null,null]; } return [o, segs[segs.length-1]]; }
function step(o, seg){ if(seg.startsWith('#')) return Array.isArray(o) ? o.find(x=>x.id===seg.slice(1)) : undefined; return o?.[seg]; }
function getPath(p){ const [o,k] = resolve(p); return o==null ? undefined : step(o,k); }
function setPath(p, v){ const [o,k] = resolve(p); if(o!=null){ o[k] = v; } }

/* ---------- inline editing ---------- */
const hooks = {};
function ed(path, opts={}){
  const val = getPath(path) ?? '';
  const {multi=false, cls='', ph='', mdr=false, tag, hook=''} = opts;
  const t = tag || (multi ? 'div' : 'span');
  const inner = String(val).trim() ? (mdr ? md(val) : esc(val)) : `<span class="ph">${esc(ph)}</span>`;
  return `<${t} class="ed ${multi?'ed-multi':''} ${cls}" data-path="${esc(path)}" data-multi="${multi?1:0}" data-md="${mdr?1:0}" data-ph="${esc(ph)}" data-hook="${esc(hook)}" tabindex="0">${inner}</${t}>`;
}
function beginEdit(node){
  if(node.classList.contains('editing')) return;
  const path = node.dataset.path, multi = node.dataset.multi==='1';
  const orig = getPath(path) ?? '';
  node.classList.add('editing');
  const inp = document.createElement(multi ? 'textarea' : 'input');
  inp.value = orig;
  node.innerHTML = ''; node.appendChild(inp);
  const autosize = () => { if(multi){ inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'; } };
  autosize(); inp.focus();
  if(multi && typeof attachDictation === 'function') attachDictation(inp, {compact:true});
  const commit = debounce(() => { setPath(path, inp.value); save(); }, 500);
  inp.addEventListener('input', () => { autosize(); commit(); });
  inp.addEventListener('keydown', e => { if(e.key==='Enter' && !multi){ e.preventDefault(); inp.blur(); } if(e.key==='Escape'){ inp.blur(); } e.stopPropagation(); });
  inp.addEventListener('blur', () => {
    const v = inp.value; setPath(path, v); saveNow();
    node.classList.remove('editing');
    node.innerHTML = v.trim() ? (node.dataset.md==='1' ? md(v) : esc(v)) : `<span class="ph">${esc(node.dataset.ph)}</span>`;
    if(v !== orig){ const p = el('<span class="saved-pulse">saved</span>'); node.appendChild(p); setTimeout(()=>p.remove(), 1200); sound('save'); const h = node.dataset.hook; if(h){ const [name, arg] = h.split(':'); hooks[name]?.(arg, orig, v, node); } }
  });
}
document.addEventListener('click', e => { const n = e.target.closest('.ed'); if(n && !e.target.closest('a')) beginEdit(n); });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.classList?.contains('ed')) { e.preventDefault(); beginEdit(e.target); } });

/* ---------- toast, ripple, tween ---------- */
function toast(msg, ms=3200, action=null){ const t = el(`<div class="toast">${msg}${action?` <button class="toast-act">${esc(action.label)}</button>`:''}</div>`); $('#toasts').appendChild(t); const kill = () => { t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),400); }; if(action) t.querySelector('.toast-act').onclick = () => { action.fn(); kill(); }; setTimeout(kill, ms); return t; }

/* ---------- universal delete: confirm → animate out → 5 s undo buffer → commit ---------- */
const pendingDeletes = new Map();
function confirmDelete(label, onConfirm){
  const m = openModal(`<h2>Delete this entry?</h2><p class="muted">This cannot be undone.${label?`<br><span class="mono">${esc(label)}</span>`:''}</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-x="no">Cancel</button><button class="btn destructive" data-x="yes">Delete</button></div>`,'narrow');
  m.querySelector('[data-x=no]').onclick = () => m.remove(); m.querySelector('[data-x=yes]').onclick = () => { m.remove(); onConfirm(); };
}
function animateOut(node, done){
  if(!node || !node.isConnected || reduced()){ done(); return; }
  const h = node.offsetHeight; node.style.height = h+'px'; node.style.overflow = 'hidden'; node.style.boxSizing = 'border-box';
  node.style.transition = 'opacity .2s var(--ease), height .2s var(--ease), margin .2s var(--ease), padding .2s var(--ease)';
  void node.offsetHeight;   // commit the start state so the transition runs without waiting for a frame
  node.style.opacity = '0'; node.style.height = '0px'; node.style.marginTop = '0'; node.style.marginBottom = '0'; node.style.paddingTop = '0'; node.style.paddingBottom = '0';
  setTimeout(done, 210);
}
/* remove(): mutate S and return a restore() closure. The object stays in memory for 5 s; Undo restores it before the store commits. */
function requestDelete({label='Entry', node=null, remove, after=null, skipConfirm=false}){
  const run = () => animateOut(node, () => {
    const restore = remove(); const id = uid();
    const timer = setTimeout(() => { pendingDeletes.delete(id); saveNow(); }, 5000);
    pendingDeletes.set(id, {restore, timer});
    (after || rerender)();
    toast(`${esc(label)} deleted`, 5000, {label:'Undo', fn: () => { const p = pendingDeletes.get(id); if(!p) return; clearTimeout(p.timer); pendingDeletes.delete(id); p.restore(); saveNow(); rerender(); toast('Restored.'); }});
  });
  run(); // no confirmation step — the five-second Undo in the toast is the safety net
}
function flushPendingDeletes(){ if(!pendingDeletes.size) return; pendingDeletes.forEach(p => clearTimeout(p.timer)); pendingDeletes.clear(); saveNow(); }
window.addEventListener('beforeunload', flushPendingDeletes);
/* A quiet, collapsed management section for persistent things (stages, visions, skills, projects, values). Delete lives here, not on hover. */
function moreSection(inner, label='More'){ return `<details class="more-section"><summary><span class="mono">${esc(label)}</span></summary><div class="body">${inner}</div></details>`; }
function spliceOut(arr, pred){ const i = arr.findIndex(pred); if(i < 0) return () => {}; const [item] = arr.splice(i, 1); return () => { arr.splice(Math.min(i, arr.length), 0, item); }; }
function snapshotLinks(list){ const saved = list.map(o => [o, JSON.stringify(o.links)]); return () => saved.forEach(([o, j]) => { o.links = JSON.parse(j); }); }
function ripple(x, y, color){ if(reduced()) return; const r = el(`<div class="ripple"></div>`); r.style.left = x+'px'; r.style.top = y+'px'; r.style.setProperty('--c', color||'var(--terra)'); document.body.appendChild(r); setTimeout(()=>r.remove(), 1000); }
function reduced(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; }
function tween(node, to, {dur=700, dec=0, suffix=''}={}){
  const from = parseFloat(node.dataset.val ?? node.textContent) || 0; node.dataset.val = to;

function recordMotifSVG(seedStr, color){
  const r = mulberry32(hashSeed(seedStr)); const c = color || A;
  const cx = 600 + (r()-.5)*160, cy = 380 + (r()-.5)*120;
  let g = '';

    const rad = 90 + i*(50 + r()*46); const a0 = r()*Math.PI*2, sweep = .8 + r()*4.2;
    const x0 = cx + Math.cos(a0)*rad, y0 = cy + Math.sin(a0)*rad;
    const x1 = cx + Math.cos(a0+sweep)*rad, y1 = cy + Math.sin(a0+sweep)*rad;
    g += `<path d="M${x0.toFixed(0)},${y0.toFixed(0)} A${rad.toFixed(0)},${rad.toFixed(0)} 0 ${sweep>Math.PI?1:0} 1 ${x1.toFixed(0)},${y1.toFixed(0)}" fill="none" stroke="${c}" stroke-width="${(1.4+r()*2.6).toFixed(1)}" opacity="${(.28+r()*.34).toFixed(2)}" stroke-linecap="round"/>`;
  }
  const strokes = 3 + Math.floor(r()*4);
  for(let i=0;i<strokes;i++){
    const a = r()*Math.PI*2, len = 120 + r()*300;
    const x0 = cx + Math.cos(a)*(60+r()*140), y0 = cy + Math.sin(a)*(60+r()*140);
    g += `<path d="M${x0.toFixed(0)},${y0.toFixed(0)} q${(Math.cos(a+1)*len*.5).toFixed(0)},${(Math.sin(a+1)*len*.5).toFixed(0)} ${(Math.cos(a)*len).toFixed(0)},${(Math.sin(a)*len).toFixed(0)}" fill="none" stroke="${c}" stroke-width="${(1.2+r()*2).toFixed(1)}" opacity="${(.2+r()*.28).toFixed(2)}" stroke-linecap="round"/>`;
  }
  const dots = 5 + Math.floor(r()*9);
  for(let i=0;i<dots;i++){
    const a = r()*Math.PI*2, rad = 60 + r()*330;
    g += `<circle cx="${(cx+Math.cos(a)*rad).toFixed(0)}" cy="${(cy+Math.sin(a)*rad).toFixed(0)}" r="${(2+r()*7).toFixed(1)}" fill="${c}" opacity="${(.2+r()*.35).toFixed(2)}"/>`;
  }
  const seal = 92 + r()*40;
  g += `<rect x="${(cx-seal/2).toFixed(0)}" y="${(cy-seal/2).toFixed(0)}" width="${seal.toFixed(0)}" height="${seal.toFixed(0)}" rx="${(6+r()*12).toFixed(0)}" fill="none" stroke="${c}" stroke-width="3" opacity=".5" transform="rotate(${(r()*20-10).toFixed(1)} ${cx.toFixed(0)} ${cy.toFixed(0)})"/>`;
  return scWrap(g);
}

  switch(name){

/* ============================================================
   VOICE & AI — speaking, tidying, and one honest report.

   Dictation uses the browser's own speech recogniser. No audio is
   recorded, stored or uploaded; the browser hands back text and
   the text is all that exists.

   Polishing and the pattern report work in two modes:
     · local   — always available, no key, nothing leaves the page.
                 Rule-based cleanup and real statistics.
     · Claude  — if you paste an Anthropic API key in Settings, the
                 same material is sent to the API for a better pass.
   A Claude Pro/Max or ChatGPT subscription cannot be used here:
   those are consumer products and do not issue API credentials.
   API usage is billed separately, pay as you go.
   ============================================================ */

const FILLERS = /\b(um+|uh+|erm+|er|like|you know|i mean|sort of|kind of|basically|actually|literally|just kinda)\b[,]?\s*/gi;
/* a local pass: spoken text has no punctuation and too many fillers. This
   fixes the mechanics without inventing anything you did not say. */
function tidyLocally(raw){
  let t = String(raw || '').replace(/\s+/g, ' ').trim();
  if(!t) return '';
  t = t.replace(FILLERS, '');
  // spoken punctuation words people actually say
  t = t.replace(/\s*\b(full stop|period)\b\s*/gi, '. ')
       .replace(/\s*\bcomma\b\s*/gi, ', ')
       .replace(/\s*\b(question mark)\b\s*/gi, '? ')
       .replace(/\s*\b(exclamation (mark|point))\b\s*/gi, '! ')
       .replace(/\s*\b(new paragraph|paragraph break)\b\s*/gi, '\n\n')
       .replace(/\s*\b(new line)\b\s*/gi, '\n');

  t = t.replace(/([a-z0-9])\s+(?=(?:And then|But then|So then|And so)\b)/g, '$1. ');
  t = t.replace(/\s+([,.;:!?])/g, '$1').replace(/([,.;:!?])(?=[^\s\d])/g, '$1 ');

  t = t.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g, (m,a,b) => a + b.toUpperCase()).replace(/\bi\b/g, 'I');

class MiniTable {

}
class MiniDexie {

function stateToStores(state){

}
function storesToState(rows){

  ARRAY_STORES.forEach(k => state[k] = rows[k] || []);
  state.habitLog = {}; (rows.habitLog || []).forEach(r => state.habitLog[r.day] = r.log);

function sparkline(vals, {w=200,h=40,color='var(--terra)',min,max,fill=true,dots=false,labels}={}){
  const v = vals.map(x => x==null ? null : +x); const present = v.filter(x=>x!=null);
  if(!present.length) return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--line-2)" stroke-dasharray="2 3"/></svg>`;
  const lo = min ?? Math.min(...present), hi = max ?? Math.max(...present); const rng = (hi-lo)||1;
  const pts = v.map((x,i) => x==null ? null : [ (i/(Math.max(v.length-1,1)))*w, h-4-((x-lo)/rng)*(h-8) ]);
  let d=''; let started=false;
  pts.forEach(p => { if(!p){ started=false; return; } d += (started?'L':'M') + p[0].toFixed(1)+','+p[1].toFixed(1)+' '; started=true; });
  const area = fill && pts.filter(Boolean).length>1 ? `<path d="${d} L${pts.filter(Boolean).slice(-1)[0][0].toFixed(1)},${h} L${pts.filter(Boolean)[0][0].toFixed(1)},${h} Z" fill="${color}" opacity=".08"/>` : '';
  const ds = dots ? pts.map((p,i) => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}" data-i="${i}" ${labels?`><title>${esc(labels[i])}</title></circle`:'/'}>` : '').join('') : '';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">${area}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>${ds}</svg>`;
}
function multiSpark(series, {w=300,h=70,min=1,max=5}={}){
  const rng = (max-min)||1;
  const lines = series.map(({vals,color}) => { const pts = vals.map((x,i)=> x==null?null:[(i/Math.max(vals.length-1,1))*w, h-4-((x-min)/rng)*(h-8)]); let d='',st=false; pts.forEach(p=>{ if(!p){st=false;return;} d+=(st?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)+' '; st=true; }); return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" opacity=".85" stroke-linejoin="round"/>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${lines}</svg>`;
}
function radar(axes, series, {size=300}={}){
  // axes: [{name,color}], series: [{vals:[0-100], color, dashed, fill}]
  const c = size/2, r = size/2 - 58, n = axes.length;
  const pt = (i,v) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [c + Math.cos(a)*r*v/100, c + Math.sin(a)*r*v/100]; };
  let g = '';
  [25,50,75,100].forEach(l => { g += `<polygon points="${axes.map((_,i)=>pt(i,l).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="${l===100?1:.6}"/>`; });
  axes.forEach((a,i) => { const [x,y] = pt(i,100); const [lx,ly] = pt(i,124); g += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" style="fill:${a.color};font-family:var(--serif);font-size:10.5px;letter-spacing:.02em">${esc(a.short||a.name)}</text>`; });
  series.forEach(s => { const pts = s.vals.map((v,i)=>pt(i,v??0).map(x=>x.toFixed(1)).join(',')).join(' '); g += `<polygon class="radar-poly" points="${pts}" fill="${s.fill===false?'none':s.color}" fill-opacity="${s.dashed?.06:.18}" stroke="${s.color}" stroke-width="${s.dashed?1.2:2}" ${s.dashed?'stroke-dasharray="4 4"':''} stroke-linejoin="round" style="transition:all .6s var(--ease)"/>`; });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;display:block;margin:0 auto;overflow:visible">${g}</svg>`;
}
function ringSVG(pct, {size=64, color='var(--sage)', stroke=6, label=''}={}){
  const r = (size-stroke)/2, C = 2*Math.PI*r, off = C*(1-clamp(pct,0,1));
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .7s var(--ease)"/>${label?`<text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" style="fill:var(--text);font-size:${size/4.5}px;font-family:var(--serif)">${esc(label)}</text>`:''}</svg>`;

hooks.stageNarrative = (sid, oldV, newV) => { const s = byId(S.stages,sid); if(!s || !oldV.trim() || oldV===newV) return; const a = new Set(oldV.toLowerCase().split(/\W+/)), b = new Set(newV.toLowerCase().split(/\W+/)); let shared=0; a.forEach(w=>{ if(b.has(w)) shared++; }); const sim = shared/Math.max(a.size,1); if(sim < .85 || Math.abs(oldV.length-newV.length) > oldV.length*.2){ s.narrativeHistory = s.narrativeHistory||[]; s.narrativeHistory.push({date:today(), text:oldV}); saveNow(); toast('The story you used to tell has been kept.'); } };

function fruitCeremony(v){
  closePanel(); rerender();
  const wrap = $('#treeWrap'); const br = wrap?.querySelector(`[data-vision="${v.id}"] .lbl`); const rect = br?.getBoundingClientRect(); const cx = rect ? rect.left : innerWidth/2, cy = rect ? rect.top : innerHeight/2;
  if(!reduced()){ const c = el('<div class="fruit-ceremony"></div>'); for(let i=0;i<28;i++){ const a = Math.random()*Math.PI*2, d = 40+Math.random()*120; c.insertAdjacentHTML('beforeend', `<i style="left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+60}px;animation-delay:${Math.random()*.2}s;background:${['#d4a44c','#7f916a','#b08968'][i%3]}"></i>`); } document.body.appendChild(c); setTimeout(()=>c.remove(),1800); }
  sound('chime');
  const s8 = S.stages.find(s=>s.notyet) || S.stages.slice(-1)[0];
  s8.substages = s8.substages.filter(ss => ss.name!=='not yet' || ss.desc);
  s8.substages.push({id:uid(), name:v.name, desc:`Lived. Planted from the Vision Canvas on ${fmtDate(today(),'med')}.\n\n${v.futureMemory||''}`, photos:[], fromVision:v.id});
  S.entries.push({id:uid(),type:'reflection',title:`${v.name} — lived`,body:v.futureMemory||'A vision became a memory.',occurredAt:today(),createdAt:new Date().toISOString(),media:[],links:{stages:[s8.id],substages:[s8.substages.slice(-1)[0].id],threads:[],values:v.values.map(id=>({id,pol:'+'})),visions:[v.id],skills:[],projects:[]},people:[],places:[],emotions:[],confidence:'lived',extra:{}});
  saveNow();
  toast(`🍂 <b>${esc(v.name)}</b> has fruited. It has been planted into the Timeline as a new chapter of 未 Not Yet.`, 6000);
}

function setGoalStatus(v, status){ v.status = status; if(status==='completed'){ v.completedAt = v.completedAt || today(); v.progress = 100; if(v.confidence!=='lived') v.confidence = 'lived'; } else { v.completedAt = ''; if(v.confidence==='lived') v.confidence = 'in motion'; if(v.progress===100) v.progress = 80; } saveNow(); }

/* ---------- the reading: what the numbers mean, in sentences ---------- */
function valuesReading(){
  const out = []; const snaps = allSnapshotsWithRetro(); const latest = snaps.slice(-1)[0]; const gaps = valueGaps();
  if(!S.valueOrder.length) return ['Name a few values and this page will start telling you something.'];
  if(!latest) return ['No reading yet. Score each value once — honestly, in about two minutes — and this space will tell you where your life and your values disagree.'];
  const age = daysSince(latest.date);
  const cur = avg(S.valueOrder.map(id => latest.ratings[id] ?? 0));
  const prev = snaps.length > 1 ? avg(S.valueOrder.map(id => snaps[snaps.length-2].ratings[id] ?? 0)) : null;
  const drift = prev === null ? null : cur - prev;
  out.push(`Across ${S.valueOrder.length} values you are living at <b>${Math.round(cur)} out of 100</b>${drift===null ? ', your first reading — the number only starts meaning something on the second.' : drift > 2 ? `, up ${Math.round(drift)} since the last reading. Whatever you changed, keep doing it.` : drift < -2 ? `, down ${Math.round(Math.abs(drift))} since the last reading. Something is taking more than it gives.` : `, holding steady since the last reading.`}`);
  const worst = gaps[0];
  if(worst && worst.gap > 8) out.push(`The widest gap is <b>${esc(worst.name)}</b>: you rank it ${worst.rank}${['st','nd','rd'][worst.rank-1]||'th'} but live it at ${worst.congruence}. This is the one to spend a week on — not all of them.`);
  else if(worst) out.push(`No value is badly out of step right now. That is rarer than it sounds; the work is to keep it that way rather than to fix something.`);
  const low = [...gaps].sort((a,b)=>a.congruence-b.congruence)[0];
  if(low && low.congruence < 35 && low.id !== worst?.id) out.push(`<b>${esc(low.name)}</b> is your lowest at ${low.congruence}, though you rank it ${low.rank}${['st','nd','rd'][low.rank-1]||'th'} — worth asking whether it is genuinely a lower priority, or just neglected.`);
  if(snaps.length > 2){
    const first = snaps[0]; const climbed = S.valueOrder.map(id => ({id, d:(latest.ratings[id]??0) - (first.ratings[id]??0)})).sort((a,b)=>b.d-a.d)[0];
    if(climbed && climbed.d > 12) out.push(`Over the whole record, <b>${esc(byId(S.values,climbed.id).name)}</b> has climbed ${Math.round(climbed.d)} points. Something in how you arranged your life worked.`);
  }
  const blind = S.valueOrder.filter(id => !S.visions.some(v => v.confidence!=='lived' && v.values.includes(id)));
  if(blind.length) out.push(`${blind.length === 1 ? 'One value has' : `${blind.length} values have`} nothing you are building pointed at ${blind.length===1?'it':'them'} — ${blind.slice(0,3).map(id=>esc(byId(S.values,id).name)).join(', ')}${blind.length>3?'…':''}. Either give ${blind.length===1?'it':'one of them'} a vision, or admit it ranks lower than you say.`);
  if(age > 14) out.push(`Your last reading is <b>${age} days old</b>. Everything above is memory rather than measurement until you take a new one.`);
  return out;
}

function deleteValue(v, node, after){
  requestDelete({label: v.name, node, after, remove: () => {
    const touched = S.entries.filter(e => (e.links?.values||[]).some(x => x.id === v.id)); const rl = snapshotLinks(touched); touched.forEach(e => e.links.values = e.links.values.filter(x => x.id !== v.id));
    const vis = S.visions.filter(x => x.values.includes(v.id)); vis.forEach(x => x.values = x.values.filter(id => id !== v.id));
    const habits = S.habits.filter(h => (h.links?.values||[]).includes(v.id)); habits.forEach(h => h.links.values = h.links.values.filter(id => id !== v.id));
    const orderIdx = S.valueOrder.indexOf(v.id); S.valueOrderHistory.push({date: today(), order: [...S.valueOrder]}); S.valueOrder = S.valueOrder.filter(id => id !== v.id);
    const back = spliceOut(S.values, x => x.id === v.id);
    return () => { back(); rl(); vis.forEach(x => x.values.push(v.id)); habits.forEach(h => h.links.values.push(v.id)); S.valueOrder.splice(Math.min(orderIdx, S.valueOrder.length), 0, v.id); S.valueOrderHistory.pop(); };
  }});
}

function trendChartSVG(snaps, {w=720, h=220}={}){
  if(snaps.length < 2) return `<div class="empty">Two snapshots make a trend. Take another next week.</div>`;
  const padL = 34, padR = 12, padT = 12, padB = 26; const t0 = parseDay(snaps[0].date).getTime(), t1 = parseDay(snaps.slice(-1)[0].date).getTime(); const span = Math.max(t1 - t0, DAY);
  const X = d => padL + ((parseDay(d).getTime() - t0)/span)*(w - padL - padR); const Y = v => padT + (1 - v/100)*(h - padT - padB);
  let g = ''; [0,25,50,75,100].forEach(v => { g += `<line x1="${padL}" x2="${w-padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/><text x="${padL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`; });
  const lastX = X(snaps.slice(-1)[0].date); let prevX = -Infinity; const MIN = 78;
  snaps.forEach((s,i) => { const x = X(s.date); const isLast = i === snaps.length-1; if(!isLast && (x - prevX < MIN || lastX - x < MIN)) return; prevX = x; g += `<text x="${x.toFixed(1)}" y="${h-8}" text-anchor="${i===0?'start':isLast?'end':'middle'}">${fmtDate(s.date,'short')}${i===0||isLast?' '+s.date.slice(0,4):''}</text>`; });
  S.valueOrder.forEach(id => { const v = byId(S.values,id); const pts = snaps.filter(s => s.ratings[id] != null).map(s => [X(s.date), Y(s.ratings[id]), s]); if(!pts.length) return;
    g += `<polyline class="trend-line" data-v="${id}" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${v.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += pts.map(p => `<circle class="trend-dot" data-v="${id}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${v.color}"><title>${esc(v.name)} · ${fmtDate(p[2].date,'med')} · ${p[2].ratings[id]}</title></circle>`).join(''); });
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" width="100%" style="display:block;overflow:visible">${g}</svg>`;
}

function openNodModal(projectId, after, existing=null){
  const active = S.projects.filter(p=>p.status!=='archived' || p.id===existing?.projectId);
  const m = openModal(`<h2>${existing?'Edit nod':'A nod'}</h2><p class="muted" style="margin-top:-8px">${existing?fmtDate(existing.date,'med'):'I showed up and did this.'}</p><div class="stack">

    <input class="inp serif-lg" id="nodText" placeholder="What I did — one line" value="${esc(existing?.text||'')}" autofocus>
    <div class="dur-pick">${['15min','30min','1hr','2hr','half-day','full-day'].map(d=>`<button data-dur="${d}">${d}</button>`).join('')}</div>
    <input class="inp" id="nodLink" placeholder="link (optional) — or drop an image below" value="${esc(existing?.link||'')}">${existing?`<div class="field"><label>Date</label><input class="inp" type="date" id="nodDate" value="${existing.date}"></div>`:''}

    <div class="energy-pick">${['drained','low','neutral','good','energized'].map((l,i)=>`<button data-en="${i+1}" class="${(existing?existing.energy:3)===i+1?'on':''}">${l}</button>`).join('')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="nodSave">${existing?'Save':'Nod ↵'}</button></div></div>`,'narrow');
  let dur=existing?.duration||'', energy=existing?.energy||3, image=existing?.image||'';
  if(dur) m.querySelectorAll('[data-dur]').forEach(x=>x.classList.toggle('on', x.dataset.dur===dur));
  m.querySelectorAll('[data-dur]').forEach(b => b.onclick = () => { dur = dur===b.dataset.dur ? '' : b.dataset.dur; m.querySelectorAll('[data-dur]').forEach(x=>x.classList.toggle('on', x.dataset.dur===dur)); });
  m.querySelectorAll('[data-en]').forEach(b => b.onclick = () => { energy = +b.dataset.en; m.querySelectorAll('[data-en]').forEach(x=>x.classList.toggle('on', +x.dataset.en===energy)); });
  const dz = m.querySelector('#nodDrop'); dz.onclick = () => m.querySelector('#nodFile').click(); m.querySelector('#nodFile').onchange = e => readImages(e.target.files, img => { image = img.src; dz.textContent = 'image attached'; }); dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); }; dz.ondragleave = () => dz.classList.remove('over'); dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); readImages(e.dataTransfer.files, img => { image = img.src; dz.textContent='image attached'; }); };
  const saveNod = e => { const text = m.querySelector('#nodText').value.trim(); if(!text) return; if(existing){ Object.assign(existing, {projectId:m.querySelector('#nodP').value, text, duration:dur, link:m.querySelector('#nodLink').value.trim(), image, energy, date:m.querySelector('#nodDate').value||existing.date}); } else S.nods.push({id:uid(),projectId:m.querySelector('#nodP').value,text,duration:dur,link:m.querySelector('#nodLink').value.trim(),image,energy,date:today()}); saveNow(); ripple(e.clientX||innerWidth/2, e.clientY||innerHeight/2, 'var(--terra)'); sound('success'); m.remove(); toast('Nod recorded.'); after ? after() : (currentRoute==='projects' && rerender()); };
